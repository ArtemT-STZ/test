name: GitVersion

on:
  push:
    branches:
      - main
      - release/*
      - hotfix/*
  workflow_dispatch:

jobs:
  versioning:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Important for GitVersion to work correctly

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3.1.11
        with:
          versionSpec: '6.0'

      - name: Run GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3.1.11
        with:
          configFilePath: './GitVersion.yml'

      - name: Output Version
        run: echo "Version ${{ steps.gitversion.outputs.fullSemVer }}"

      - name: Create Git Tag
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git tag -a "v${{ steps.gitversion.outputs.fullSemVer }}" -m "Release ${{ steps.gitversion.outputs.fullSemVer }}"
          git push origin "v${{ steps.gitversion.outputs.fullSemVer }}"

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
          tag_name: "v${{ steps.gitversion.outputs.MajorMinorPatch }}"
          name: "Release v${{ steps.gitversion.outputs.MajorMinorPatch }}"
          generate_release_notes: true
          # body: |
          #   ## Changes in this release:
          #   - Auto-generated release based on commits.
          #   - Commit SHA: `${{ github.sha }}`
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
