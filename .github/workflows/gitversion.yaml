name: GitVersion

on:
  push:
    branches:
      - main
      - release/*
      - hotfix/*
  workflow_dispatch:

jobs:
  versioning:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Important for GitVersion to work correctly

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3.1.11
        with:
          versionSpec: '6.0'

      - name: Run GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3.1.11
        with:
          configFilePath: './GitVersion.yml'

      - name: Output Version
        run: echo "Version ${{ steps.gitversion.outputs.fullSemVer }}"

      - name: Create Git Tag
        if: github.ref != 'refs/heads/main'
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git tag -a "v${{ steps.gitversion.outputs.fullSemVer }}" -m "Release ${{ steps.gitversion.outputs.fullSemVer }}"
          git push origin "v${{ steps.gitversion.outputs.fullSemVer }}"

      # - name: Get Previous Tag
      #   if: github.ref == 'refs/heads/main'
      #   id: prev_tag
      #   run: echo "PREV_TAG=$(git describe --tags --abbrev=0 $(git rev-list --tags --skip=1 --max-count=1) 2>/dev/null || echo '')" >> $GITHUB_ENV

      # - name: Generate Changelog
      #   if: github.ref == 'refs/heads/main'
      #   run: |
      #     if [ -z "$PREV_TAG" ]; then
      #       echo "No previous tag found. Listing all commits..."
      #       git log --pretty=format:"- %s [%h]" > changelog.txt
      #     else
      #       echo "Generating changelog between $PREV_TAG and HEAD..."
      #       git log $PREV_TAG..HEAD --pretty=format:"- %s [%h]" > changelog.txt
      #     fi

      # - name: Create GitHub Release
      #   if: github.ref == 'refs/heads/main'
      #   uses: softprops/action-gh-release@v2
      #   with:
      #     token: ${{ secrets.GITHUB_TOKEN }}
      #     tag_name: "v${{ steps.gitversion.outputs.MajorMinorPatch }}"
      #     name: "Release v${{ steps.gitversion.outputs.MajorMinorPatch }}"
      #     body_path: changelog.txt
      #     draft: false
      #     prerelease: false
      - name: Set up Node.js
        if: github.ref != 'refs/heads/main'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        if: github.ref != 'refs/heads/main'
        run: npm install

      - name: Run semantic-release
        if: github.ref != 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
        run: npx semantic-release