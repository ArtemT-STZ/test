name: GitVersion

on:
  push:
    branches:
      - main
      - 'release/*'
      - 'hotfix/*'
  workflow_dispatch:

jobs:
  versioning:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Important for GitVersion to work correctly

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3.1.11
        with:
          versionSpec: '6.0'

      - name: Run GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3.1.11
        with:
          configFilePath: './GitVersion.yml'

      - name: Output Version
        run: echo "Version ${{ steps.gitversion.outputs.fullSemVer }}"

      - name: Create Git Tag
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git tag -a "v${{ steps.gitversion.outputs.fullSemVer }}" -m "Release ${{ steps.gitversion.outputs.fullSemVer }}"
          git push origin "v${{ steps.gitversion.outputs.fullSemVer }}"

      - name: Install GitReleaseManager
        if: github.ref == 'refs/heads/main'
        uses: gittools/actions/gitreleasemanager/setup@v3.1.11
        with:
          versionSpec: '0.18.x'

      - name: Generate Release Notes
        if: github.ref == 'refs/heads/main'
        run: |
          gitreleasemanager export \
            --token ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }} \
            --owner ${{ github.repository_owner }} \
            --repository $(basename ${{ github.repository }}) \
            # --milestone "v${{ steps.gitversion.outputs.MajorMinorPatch }}" \
            --inputFile release-notes.md

      - name: Create Release with GitReleaseManager
        if: github.ref == 'refs/heads/main'
        run: |
          gitreleasemanager create \
            --token ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }} \
            --owner ${{ github.repository_owner }} \
            --repository $(basename ${{ github.repository }}) \
            --name "v${{ steps.gitversion.outputs.MajorMinorPatch }}" \
            --targetcommitish "main" \
            --inputFile release-notes.md \
            --prerelease false
