name: GitVersion

on:
  push:
    branches:
      - main
      - develop
      - 'release/*'
      - 'feature/*'
      - 'hotfix/*'
  pull_request:
    branches:
      - main
      - develop
      - 'release/*'
      - 'feature/*'
      - 'hotfix/*'
  workflow_dispatch:

jobs:
  versioning:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Important to fetch all branches for GitVersion to work correctly

      - name: Install GitVersion
        # id: gitversion
        uses: gittools/actions/gitversion/setup@v3.1.11
        with:
          versionSpec: '6.0'

      - name: Run GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3.1.11
        with:
          configFilePath: './GitVersion.yml'

      # - name: Output Version
      #   run: echo "Version: ${{ steps.gitversion.outputs.fullSemVer }}"

      - name: Create Git Tag
        # if: github.ref == 'refs/heads/main'
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git tag -a "v${{ steps.gitversion.outputs.fullSemVer }}" -m "Release ${{ steps.gitversion.outputs.fullSemVer }}"
          git push origin "v${{ steps.gitversion.outputs.fullSemVer }}"
